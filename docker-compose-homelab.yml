services:
  daedalos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daedalos
    restart: unless-stopped
    networks:
      - web
    ports:
      - "8158:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - daedalos_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  web:
    external: true
    name: homelab-web

volumes:
  daedalos_data:
    driver: local
